    const ae=Number(a['相對大盤20日%']);const be=Number(b['相對大盤20日%']);
    if(Number.isFinite(ae)||Number.isFinite(be)){if(!Number.isFinite(ae))return 1;if(!Number.isFinite(be))return -1;if(be!==ae)return be-ae;}
    return String(a['代號']??'').localeCompare(String(b['代號']??''));
  });
}
function laneMemberTable(rows,industry){
  if(!Array.isArray(rows)) return '<div class="empty">'+esc(industry)+'：無成員資料</div>';
  const strong=rows.filter(r=>r['符合觀察']===true);
  const ordered=rows.slice().sort((a,b)=>{
    if(Boolean(a['符合觀察'])!==Boolean(b['符合觀察'])) return Boolean(b['符合觀察'])-Boolean(a['符合觀察']);
    const ae=Number(a['相對大盤20日%']);const be=Number(b['相對大盤20日%']);
    if(Number.isFinite(ae)&&Number.isFinite(be)&&be!==ae)return be-ae;
    return String(a['代號']??'').localeCompare(String(b['代號']??''));
  });
  return '<div data-member-panel="all">'+table(ordered,LANE_MEMBER_COLUMNS,'market_lanes_members')+'</div>'+
    '<div data-member-panel="strong" hidden>'+table(ordered.filter(r=>r['符合觀察']===true),LANE_MEMBER_COLUMNS,'market_lanes_members')+'</div>';
}
function laneTable(s,rows){
  if(!rows||!rows.length) return table(rows,s.columns,s.key);
  const cols=s.columns;
  const header='<thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>成員</th></tr></thead>';
  const body=rows.map((r,i)=>{
    const industry=String(r['產業']??'');
    const cells=cols.map(c=>{
      if(c==='有效檔數'||c==='強勢檔數'){
        const mode=c==='有效檔數'?'all':'strong';
        const label=c==='有效檔數'?'顯示全部有效成員':'僅顯示強勢成員';
        return '<td><button type="button" class="lane-member-toggle" data-lane-index="'+i+'" data-member-mode="'+mode+'" data-industry="'+esc(industry)+'">'+esc(industry)+' · '+label+' · '+esc(r[c])+'</button></td>';
      }
      return '<td>'+esc(cell(r,c,s.key))+'</td>';
    }).join('');
    const members=Array.isArray(r['成員'])?r['成員']:null;
    return '<tr>'+cells+'<td>'+ (members?members.length:'—') +'</td></tr>'+
      '<tr class="lane-members" data-lane-index="'+i+'" hidden><td colspan="'+(cols.length+1)+'"><strong>'+esc(industry)+'</strong><div class="lane-member-panels">'+laneMemberTable(members,industry)+'</div></td></tr>';
  }).join('');
  return '<div class="wrap"><table>'+header+'<tbody>'+body+'</tbody></table></div>';
}
function sectionTable(s,rows){
  const limit=DISPLAY_LIMITS[s.key];
  if(s.key==='market_lanes'){
    const visible=limit&&rows&&rows.length>limit?rows.slice(0,limit):rows;
    const outer=laneTable(s,visible);
    return !limit||!rows||rows.length<=limit?outer:outer+
      '<details><summary>顯示前 '+limit+' / 共 '+rows.length+' 筆；展開其餘</summary>'+laneTable(s,rows.slice(limit))+'</details>';
  }
  if(!limit||!rows||rows.length<=limit) return table(rows,s.columns,s.key);
  return table(rows.slice(0,limit),s.columns,s.key)+
    '<details><summary>顯示前 '+limit+' / 共 '+rows.length+' 筆；展開其餘</summary>'+
    table(rows.slice(limit),s.columns,s.key)+'</details>';
}
function draw(d){
  const day=P.days[d];
  const rb=document.getElementById('regime'), bd=document.getElementById('body');
  const bf=document.getElementById('backfill');
  if(!day){rb.innerHTML='';bd.innerHTML='<div class="empty">該日無掃描資料。</div>';bf.hidden=true;return;}
  if(day.backfill){bf.textContent='⚠️ '+BACKFILL_NOTE;bf.hidden=false;}else{bf.hidden=true;}
  const j=day.journal||{};
  rb.innerHTML=Object.keys(j).length
    ? Object.entries(j).map(([k,v])=>'<div><span>'+esc(k)+'</span>'+esc(v)+'</div>').join('')
    : '<div class="empty">大盤資料：無資料</div>';
  const fullMarket=day.sections&&day.sections.full_market;
  document.getElementById('observer-controls').hidden=!Array.isArray(fullMarket);
  bd.innerHTML=L.map(s=>'<h2>'+esc(s.title)+'</h2>'+
    (s.definition?'<div class="definition">'+esc(s.definition)+'</div>':'')+
    sectionTable(s,s.key==='full_market'?sortFullMarket((day.sections||{})[s.key]||[],fullMarketSort.value):(day.sections||{})[s.key])).join('');
}
sel.addEventListener('change',e=>draw(e.target.value));
fullMarketSort.addEventListener('change',()=>{if(sel.value)draw(sel.value);});
document.getElementById('body').addEventListener('click',e=>{
  const button=e.target.closest('.lane-member-toggle');
  if(!button)return;
  const detail=button.closest('tr').nextElementSibling;
  if(!detail)return;
  const mode=button.dataset.memberMode;
  if(!detail.hidden&&detail.dataset.mode===mode){detail.hidden=true;return;}
  detail.hidden=false;detail.dataset.mode=mode;
  detail.querySelectorAll('[data-member-panel]').forEach(panel=>{panel.hidden=panel.dataset.memberPanel!==mode;});
});
if(P.dates.length){sel.value=P.dates[P.dates.length-1];draw(sel.value);}
else{document.getElementById('body').innerHTML='<div class="empty">無掃描資料。</div>';}
</script></body></html>
